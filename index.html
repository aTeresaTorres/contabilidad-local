<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Contabilidad</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- PANTALLA DE LOGIN -->
    <div id="loginScreen" class="container">
        <div class="card">
            <h1>Iniciar Sesión</h1>
            
            <!-- Campos de email/contraseña -->
            <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
            <input type="password" id="loginPassword" placeholder="Contraseña" required>
            <button onclick="login()" class="btn-primary">Ingresar</button>
            
            <!-- 👇 AÑADE ESTO: SEPARADOR Y BOTÓN DE GOOGLE -->
            <div class="divider">
                <span>o continúa con</span>
            </div>
            
            <button onclick="loginWithGoogle()" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Iniciar con Google
            </button>
            
            <p>¿No tienes cuenta? <a href="#" onclick="showRegister()">Regístrate</a></p>
        </div>
    </div>

    <!-- PANTALLA DE REGISTRO -->
    <div id="registerScreen" class="container" style="display:none">
        <div class="card">
            <h1>Crear Cuenta</h1>
            <input type="email" id="registerEmail" placeholder="Correo electrónico" required>
            <input type="password" id="registerPassword" placeholder="Contraseña" required>
            <button onclick="register()" class="btn-primary">Crear cuenta</button>
            
            <!-- 👇 OPCIÓN: También puedes añadir Google aquí -->
            <div class="divider">
                <span>o regístrate con</span>
            </div>
            <button onclick="loginWithGoogle()" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <!-- Mismo SVG de Google -->
                </svg>
                Registrarse con Google
            </button>
            
            <p>¿Ya tienes cuenta? <a href="#" onclick="showLogin()">Inicia sesión</a></p>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="dashboard" style="display:none">
        <header>
            <div class="header-title">
                <h1>Mi Contabilidad</h1>
                <span class="header-subtitle">Resumen de tus movimientos</span>
            </div>
            <button onclick="logout()" class="btn-logout">Cerrar sesión</button>
        </header>

        <div class="dashboard-content">
            <!-- RESULTADO GENERAL -->
            <div class="result-card" id="resultCard">
                <h2>Resultado General</h2>
                <div class="result-number" id="totalBalance">$0.00</div>
                <p id="resultStatus">En verde</p>
            </div>

            <!-- BOTONES DE REGISTRO -->
            <div class="action-buttons">
                <button onclick="openRegisterModal('income')" class="btn-income">
                    <span class="btn-icon" aria-hidden="true">+</span>
                    <span>Registrar Ganancia</span>
                </button>
                <button onclick="openRegisterModal('expense')" class="btn-expense">
                    <span class="btn-icon" aria-hidden="true">–</span>
                    <span>Registrar Pérdida</span>
                </button>
            </div>

            <!-- HISTORIAL DE MOVIMIENTOS -->
            <div class="history-section">
                <h3>Historial de movimientos</h3>
                <div id="movementsList"></div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA REGISTRAR MOVIMIENTO -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Registrar Movimiento</h2>
            <form id="movementForm">
                <label>Monto ($)</label>
                <input type="number" id="movementAmount" step="0.01" required>

                <label>Fecha de cierre</label>
                <input type="date" id="movementDate" required>

                <label>Descripción (opcional)</label>
                <input type="text" id="movementDescription" placeholder="Ej: Venta de productos">

                <button type="submit" id="submitMovement" class="btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <!-- SCRIPTS DE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- TUS SCRIPTS -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
